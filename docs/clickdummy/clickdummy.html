 '<div class="box"><h2>Laufprotokoll</h2><table><tr><th>Datum</th><th>Ergebnis</th><th class="num">Vorschläge</th><th class="num">Freigegeben</th><th>Abdeckungsgrenzen</th></tr>'+(nr.datum?'<tr><td>'+fmt(nr.datum)+'</td><td><span class="tag">Geplant</span></td><td class="num">–</td><td class="num">–</td><td>–</td></tr>':'')+
 S.runs.map(r=>'<tr><td>'+fmt(r.datum)+'</td><td>'+(r.erg==='Ausgeführt'?'<span class="tag ok">Ausgeführt</span> <button class="btn s" data-a="runOpen" data-id="'+r.id+'">Lauf öffnen</button>':'<span class="tag '+(r.erg.startsWith('Ausgeführt')?'e':'x')+'">'+esc(r.erg)+'</span>')+'</td><td class="num">'+(r.n??'–')+'</td><td class="num">'+(r.frei??'–')+'</td><td>'+esc(r.grenzen||'–')+'</td></tr>').join('')+'</table></div></div></div>'};

/* ---------- Rahmen ---------- */
const NAV=[['S1','Dashboard'],['S2','Eingangskorb'],['S3','Firmen'],['S4','Kontakte'],['S5','Ansprache'],['S6','Wiedervorlagen'],['S7','SAP-Übergabe'],['S9','Agent-Steuerung'],['S8','Einstellungen']];
function render(){
 const cnt={S2:S.runs.reduce((n,r)=>n+(r.props||[]).filter(p=>p.status==='Zu prüfen').length,0),S5:S.contacts.filter(c=>c.status==='Freigegeben').length,S6:openFollow().filter(w=>w.faellig<=S.today).length};
 document.getElementById('demo').innerHTML='<div class="row"><b>Vorführleiste</b><span>gehört nicht zum Produkt</span><span>Perspektive: Marco (einzige Rolle mit Oberfläche)</span><span>Datum im Dummy: '+fmt(S.today)+'</span><span class="sid">Screen '+S.view+'</span><button data-a="reset">Zurücksetzen</button></div>'+
 '<div class="row"><span>Abläufe:</span>'+[['A1','Lauf übernehmen'],['A2','Prüfen und freigeben'],['A3','Ansprechen'],['A4','Antwort und Nachfassen'],['A5','An SAP übergeben'],['A6','Wirkung prüfen'],['A7','Agent einstellen']].map(f=>'<button data-a="flow" data-f="'+f[0]+'">'+f[0]+' '+f[1]+'</button>').join('')+'</div>'+
 '<div class="row"><span>Ereignisse:</span><button data-a="morning">Nächster Werktag, 6:30 Uhr: Agent meldet sich</button><label><input type="checkbox" data-b="demo.apiDown" data-r="1"'+(S.demo.apiDown?' checked':'')+'>Cockpit-API für den Agenten nicht erreichbar</label><label><input type="checkbox" data-b="demo.overflow" data-r="1"'+(S.demo.overflow?' checked':'')+'>25 ungeprüfte Vorschläge im Eingangskorb</label><label><input type="checkbox" data-b="demo.kpi20" data-r="1"'+(S.demo.kpi20?' checked':'')+'>Kennzahlen ab 20 Kontakten zeigen</label></div><div class="row narrow">Das Cockpit ist nur für den Desktop gedacht. Am Handy bitte seitlich scrollen oder am Rechner öffnen.</div>';
 document.getElementById('nav').innerHTML='<div class="brand">CX Lead Cockpit<span>Nagarro Customer Experience</span></div>'+NAV.map(n=>'<button data-a="nav" data-v="'+n[0]+'"'+(S.view===n[0]?' class="on" aria-current="page"':'')+'><span>'+n[1]+(cnt[n[0]]?'<span class="cnt">'+cnt[n[0]]+'</span>':'')+'</span><small>'+n[0]+'</small></button>').join('');
 document.getElementById('main').innerHTML=V[S.view]();
 document.getElementById('toast').textContent=S.toast;
 live()}
function live(){const s=S.s5;if(S.view!=='S5'||!s||!s.mode)return;const wc=document.getElementById('wc');
 if(wc){const n=words(s.text);wc.textContent=n+' Wörter'+(s.mode==='Erstkontakt'?(n>=45&&n<=70?', im Zielkorridor 45–70':', Zielkorridor für LinkedIn ist 45–70'):'')}
 const m=document.getElementById('mailto');if(m){const why=s.mailT==null?'Erst die E-Mail-Fassung erzeugen.':!s.grund?'Erst die geprüfte Grundlage wählen.':s.grund==='Andere'&&!s.notiz.trim()?'Bei „Andere“ fehlt die Notiz.':!/.+@.+\..+/.test(s.empf)?'Empfängeradresse fehlt.':'';
  m.classList.toggle('off',!!why);if(why){m.removeAttribute('href');m.setAttribute('aria-disabled','true')}else{m.removeAttribute('aria-disabled');m.href='mailto:'+encodeURIComponent(s.empf)+'?subject='+encodeURIComponent(s.mailB)+'&body='+encodeURIComponent(s.mailT)}
  document.getElementById('mailhint').textContent=why||'Öffnet dein Mailprogramm an '+s.empf+'. Gesendet wird erst dort.'}}
function setPath(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]={};o=o[k[i]]}o[k[k.length-1]]=v}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled||el.classList.contains('off'))return;
 if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();const d=el.dataset;
 if(d.go){S.view=d.go;S.ui={}}A[d.a](d);render()});
function bind(e){const el=e.target;
 if(el.dataset.arr){const a=S.draft[el.dataset.arr],i=a.indexOf(el.value);if(el.checked&&i<0)a.push(el.value);if(!el.checked&&i>=0)a.splice(i,1);return}
 const p=el.dataset.b;if(!p)return;let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.n)v=+v;
 if(p==='firmAdr'){firm(el.dataset.id).adr=v;return}if(p==='firmKon'){firm(el.dataset.id).kon=v;return}
 setPath(p,v);if(el.dataset.r&&(e.type==='change'||el.type==='text'))render();else live();
 if(el.dataset.r&&el.type==='text'){const n=document.querySelector('[data-b="'+p+'"]');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}
document.addEventListener('input',bind);document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'||e.target.type==='checkbox'||e.target.type==='date')bind(e)});
render();
</script>
